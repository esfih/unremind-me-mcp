# Publish the UnRemind MCP server to the official MCP Registry.
#
# Uses GitHub Actions OIDC rather than the interactive `mcp-publisher login`
# device-code flow, so publishing needs no human step at all -- the runner's
# OIDC token proves ownership of the io.github.esfih/* namespace. That is
# the whole reason this is a workflow and not a local command.
#
# Trigger manually (Actions -> Publish MCP Server -> Run workflow) or by
# pushing a tag. Bump `version` in server.json first; the registry rejects a
# re-publish of an existing version.
name: Publish MCP Server

on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for the github-oidc auth method. Without `id-token: write`
      # the publisher cannot prove namespace ownership and login fails.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Validate server.json
        run: mcp-publisher validate

      # Fail loudly if the endpoint we are about to advertise is not
      # actually answering. Publishing a listing that points at a dead
      # endpoint is the exact anti-marketing failure the whole discovery
      # strategy exists to avoid.
      - name: Verify the advertised endpoint is live
        run: |
          # Runs from a GitHub-hosted runner, i.e. a datacenter IP behind our
          # CDN's bot protection. Print the body as well as the code: a 403
          # here means the edge blocked the runner, which is a very different
          # problem from the origin being down, and the status code alone
          # cannot tell them apart.
          out=$(curl -s -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: unremind-mcp-registry-publish/1.0' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' https://unremind.me/mcp)
          code=$(printf '%s' "$out" | tail -n1)
          body=$(printf '%s' "$out" | sed '$d' | head -c 300)
          echo "POST /mcp -> $code"
          echo "body: $body"
          case "$code" in
            401) echo "OK: auth required, endpoint alive" ;;
            403) echo "::error::Edge/WAF blocked the runner (403). The origin is probably fine; allow this User-Agent or datacenter range." ; exit 1 ;;
            *)   echo "::error::Unexpected status $code" ; exit 1 ;;
          esac

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish (manage server)
        run: mcp-publisher publish

      # The submit server is a SECOND registry entry from the same repo.
      # Publishing it here rather than hand-submitting to each directory is
      # what makes downstream marketplaces ingest it under our canonical
      # identifier -- Glama derived `me.unremind/un-remindme` from the domain
      # for a hand submission, but inherited `io.github.esfih/unremind-me`
      # from server.json for the ingested one.
      - name: Verify the submit endpoint is live
        run: |
          out=$(curl -s -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: unremind-mcp-registry-publish/1.0' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            https://unremind.me/mcp/submit)
          code=$(printf '%s' "$out" | tail -n1)
          echo "POST /mcp/submit -> $code"
          [ "$code" = "200" ] || { echo "::error::submit endpoint returned $code"; exit 1; }

      - name: Publish (submit server)
        run: mcp-publisher publish --file server-submit.json
